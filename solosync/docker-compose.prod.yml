services:
  homepage:
    image: ${HOME_IMAGE}
    restart: unless-stopped
    ports: ["8080:80"]
  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports: ["8081:80"]
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    ports: ["4000:4000"]
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_URL: http://backend:4000/webhooks/waha
      WAHA_WEBHOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY}
      BILLING_ENABLED: ${BILLING_ENABLED}
      ACTIVATION_FEE_PAISE: "39900"
      MESSAGE_FEE_PAISE: "10"
    depends_on: [waha]
